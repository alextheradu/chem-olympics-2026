      - generic [ref=e588]:
        - generic [ref=e590]:
          - heading "Cost shifts to growers" [level=4] [ref=e591]
          - paragraph [ref=e592]: IPM is labour-intensive. Smallholders without subsidised extension services face genuine economic pressure to spray.
        - generic [ref=e594]:
          - heading "Enforcement gaps" [level=4] [ref=e595]
          - paragraph [ref=e596]: Restricted carbamates remain available through grey-market channels in many countries; illegal wildlife poisoning persists.
        - generic [ref=e598]:
          - heading "Replacement chemistry" [level=4] [ref=e599]
          - paragraph [ref=e600]: Banning one carbamate often shifts use to neonicotinoids — also bee-toxic, with their own ecological costs.
