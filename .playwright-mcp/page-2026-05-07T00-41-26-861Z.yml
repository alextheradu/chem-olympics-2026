            - link "[3],":
              - /url: "#cite-3"
            - link "[5],":
              - /url: "#cite-5"
            - link "[6]":
              - /url: "#cite-6"
        - generic [ref=e490]: First aid · If ingestion is suspected — call poison control / emergency services immediately. Do not induce vomiting unless directed.
