          - generic [ref=e486]: minutes.
        - paragraph [ref=e488]:
          - text: Carbamate poisoning is acute, often reversible, but always serious. Onset can occur within minutes of skin contact, inhalation, or ingestion. Severe cases require atropine and supportive care.
