          - generic [ref=e277]:
            - paragraph [ref=e278]: STAGE 01
            - heading "Application" [level=3] [ref=e279]
            - paragraph [ref=e280]:
              - text: Carbaryl (C₁₂H₁₁NO₂) is sprayed on crops at 1–2 kg ha⁻¹ as a wettable powder or liquid emulsion. As an N-methyl carbamate it is the ester of carbamic acid and 1-naphthol — a configuration that makes it broadly insecticidal yet hydrolytically labile.
              - superscript:
                - link "[4],":
                  - /url: "#cite-4"
                - link "[6]":
                  - /url: "#cite-6"
            - generic [ref=e281]:
              - paragraph [ref=e282]: NH₂COOH + C₁₀H₇—OH ⇌ C₁₂H₁₁NO₂ + H₂O
              - paragraph [ref=e283]: Esterification — formal synthesis from parent acid
          - generic [ref=e284]:
            - paragraph [ref=e285]: Example
            - paragraph [ref=e286]: Corn, apples, ornamentals — applied during the growing season, often pre-harvest.
      - generic [ref=e287]:
        - img [ref=e289]
        - generic [ref=e292]:
          - generic [ref=e293]:
            - paragraph [ref=e294]: STAGE 02
            - heading "Soil Binding" [level=3] [ref=e295]
            - paragraph [ref=e296]:
              - text: Carbaryl reaching the soil partitions between organic matter (sorbed) and the soil-water phase. Sorption strength rises with organic-carbon content (Kₒc ≈ 200–300). In alkaline soils, hydrolysis to 1-naphthol begins immediately.
              - superscript:
                - link "[6]":
                  - /url: "#cite-6"
            - generic [ref=e297]:
              - paragraph [ref=e298]: C₁₂H₁₁NO₂ + H₂O →[OH⁻] C₁₀H₇—OH + CH₃—NH—COOH
              - paragraph [ref=e299]: Hydrolysis dominant at pH > 7
          - generic [ref=e300]:
            - paragraph [ref=e301]: Example
            - paragraph [ref=e302]: Sandy, low-organic soils → faster leaching. Clay & peat soils → tighter binding, slower release.
      - generic [ref=e303]:
        - img [ref=e305]
        - generic [ref=e308]:
          - generic [ref=e309]:
            - paragraph [ref=e310]: STAGE 03
            - heading "Runoff" [level=3] [ref=e311]
            - paragraph [ref=e312]:
              - text: Rainfall and irrigation transport dissolved carbaryl and sediment-bound carbaryl into ditches, streams, and rivers. Detected concentrations in monitored urban streams routinely exceed chronic aquatic-life benchmarks.
              - superscript:
                - link "[3],":
                  - /url: "#cite-3"
                - link "[6]":
                  - /url: "#cite-6"
          - generic [ref=e313]:
            - paragraph [ref=e314]: Example
            - paragraph [ref=e315]: Carbaryl is detected in more than half of sampled urban streams in some U.S. monitoring programs.
      - generic [ref=e316]:
        - img [ref=e318]
        - generic [ref=e321]:
          - generic [ref=e322]:
            - paragraph [ref=e323]: STAGE 04
            - heading "Aquatic Uptake" [level=3] [ref=e324]
            - paragraph [ref=e325]:
              - text: Carbaryl is absorbed across gill membranes and skin. At the cholinergic synapse it carbamylates the serine —OH of acetylcholinesterase, blocking acetylcholine breakdown. Nerve impulses fire continuously; paralysis follows.
              - superscript:
                - link "[1]":
                  - /url: "#cite-1"
            - generic [ref=e326]:
              - paragraph [ref=e327]: AChE—OH + Carbaryl → AChE—O—C(=O)—NH—CH₃ (carbamyl-AChE)
              - paragraph [ref=e328]: Active-site carbamylation — reversible
          - generic [ref=e329]:
            - paragraph [ref=e330]: Example
            - paragraph [ref=e331]: Rainbow trout LC₅₀ ≈ 1.3 mg L⁻¹ (96 h). Daphnia magna respond at far lower concentrations.
      - generic [ref=e332]:
        - img [ref=e334]
        - generic [ref=e337]:
          - generic [ref=e338]:
            - paragraph [ref=e339]: STAGE 05
            - heading "Food Chain" [level=3] [ref=e340]
            - paragraph [ref=e341]:
              - text: Carbaryl has a low bioconcentration factor, so it does not biomagnify like organochlorines — but sub-lethal effects propagate. Slow, disoriented insects and small fish are easier prey, so predators sample disproportionately exposed organisms.
              - superscript:
                - link "[4],":
                  - /url: "#cite-4"
                - link "[6]":
                  - /url: "#cite-6"
          - generic [ref=e342]:
            - paragraph [ref=e343]: Example
            - paragraph [ref=e344]: Birds and mammals near sprayed watersheds accumulate exposure indirectly. Carbofuran has been used illegally to bait raptors.
  - generic [ref=e345]:
    - generic [ref=e347]:
      - paragraph [ref=e349]: 04 · Affected organisms
      - heading "One mechanism, three very different victims." [level=2] [ref=e350]:
        - generic [ref=e351]: One
        - generic [ref=e352]: mechanism,
        - generic [ref=e353]: three
        - generic [ref=e354]: very
        - generic [ref=e355]: different
        - generic [ref=e356]: victims.
      - paragraph [ref=e358]: Carbamate AChE inhibition is non-selective. Whatever has a cholinergic synapse — fish, bees, even soil microbiota indirectly — is at risk once the residue moves off-field.
    - generic [ref=e361]:
      - generic [ref=e362]:
        - img "Aquatic Life" [ref=e363]
        - generic [ref=e365]:
          - generic [ref=e366]: "01"
          - generic [ref=e368]: Fish & invertebrates
        - generic [ref=e369]: Pexels — freshwater stream
      - generic [ref=e370]:
        - paragraph [ref=e372]: Organism · 01
        - heading "Aquatic Life" [level=3] [ref=e373]:
          - generic [ref=e374]: Aquatic
          - generic [ref=e375]: Life
        - paragraph [ref=e377]:
          - text: Field-applied carbamates leave the soil in runoff after rainfall and irrigation, reaching ditches, streams, and rivers. Acute toxicity to fish and Daphnia begins at low parts-per-billion concentrations.
          - superscript:
            - link "[1],":
              - /url: "#cite-1"
            - link "[6]":
              - /url: "#cite-6"
        - paragraph [ref=e379]: Carbaryl crosses the gill epithelium and reaches the synapse, where it carbamylates the serine hydroxyl in the active site of acetylcholinesterase (AChE). With AChE blocked, acetylcholine accumulates and nerves fire continuously — paralysis, convulsions, organ failure follow.
        - generic [ref=e381]:
          - paragraph [ref=e382]: AChE—OH + Carbaryl → AChE—O—C(=O)—NH—CH₃ + 1-naphthol
          - paragraph [ref=e383]: Reversible carbamylation of the AChE active site
        - generic [ref=e387]: "LC₅₀ rainbow trout: 1.3 mg L⁻¹ (96 h)"
    - generic [ref=e390]:
      - generic [ref=e391]:
        - img "Pollinators" [ref=e392]
        - generic [ref=e394]:
          - generic [ref=e395]: "02"
          - generic [ref=e397]: Bees & beneficial insects
        - generic [ref=e398]: Pexels — honeybee on flower
      - generic [ref=e399]:
        - paragraph [ref=e401]: Organism · 02
        - heading "Pollinators" [level=3] [ref=e402]:
          - generic [ref=e403]: Pollinators
        - paragraph [ref=e405]:
          - text: Carbaryl is among the most acutely bee-toxic insecticides in routine use. Spray drift onto flowering crops, contact with treated foliage, or contaminated nectar all deliver lethal doses.
          - superscript:
            - link "[2],":
              - /url: "#cite-2"
            - link "[3]":
              - /url: "#cite-3"
        - paragraph [ref=e407]: The same AChE inhibition acts on the insect nervous system. Bees lose flight coordination, fail to return to the hive, and die. Sub-lethal doses impair foraging memory and brood care, eroding colony health over weeks.
        - generic [ref=e409]:
          - paragraph [ref=e410]: CH₃—NH—C(=O)—O—C₁₀H₇ + AChE—OH → CH₃—NH—C(=O)—O—AChE + C₁₀H₇—OH
          - paragraph [ref=e411]: Carbamylation at the AChE serine residue
        - generic [ref=e415]: "LD₅₀ honeybee (contact): 1.0 µg / bee — class \"highly toxic\""
    - generic [ref=e418]:
      - generic [ref=e419]:
        - img "Plants & Soil" [ref=e420]
        - generic [ref=e422]:
          - generic [ref=e423]: "03"
          - generic [ref=e425]: Crops, vegetation, microbiota
        - generic [ref=e426]: Pexels — cultivated field
      - generic [ref=e427]:
        - paragraph [ref=e429]: Organism · 03
        - heading "Plants & Soil" [level=3] [ref=e430]:
          - generic [ref=e431]: Plants
          - generic [ref=e432]: "&"
          - generic [ref=e433]: Soil
        - paragraph [ref=e435]:
          - text: Carbamates do not target plants directly, but residues persist in soil and on harvested produce. At pH > 7 carbaryl hydrolyses to 1-naphthol, which suppresses soil microbes and disturbs nitrogen cycling in the root zone.
          - superscript:
            - link "[3],":
              - /url: "#cite-3"
            - link "[6]":
              - /url: "#cite-6"
        - paragraph [ref=e437]: In alkaline or moist soils carbaryl undergoes ester hydrolysis. The 1-naphthol product is more water-soluble and biologically active against soil bacteria and fungi that fix nitrogen and decompose organic matter.
        - generic [ref=e439]:
          - paragraph [ref=e440]: C₁₂H₁₁NO₂ + H₂O →[OH⁻] C₁₀H₇—OH + CH₃—NH—COOH
          - paragraph [ref=e441]: Alkaline hydrolysis of carbaryl in soil (pH > 7)
        - generic [ref=e445]: "Soil half-life: 7–14 d aerobic, up to 28 d anaerobic"
