              - paragraph [ref=e529]: High-exposure cohorts show associations with stomach, esophageal, tongue cancers.
  - generic [ref=e532]:
    - paragraph [ref=e534]: 06 · Solutions
    - heading "Four levers. None alone is enough." [level=2] [ref=e535]:
      - generic [ref=e536]: Four
      - generic [ref=e537]: levers.
      - generic [ref=e538]: None
      - generic [ref=e539]: alone
      - generic [ref=e540]: is
      - generic [ref=e541]: enough.
    - paragraph [ref=e543]: Different actors — regulators, agronomists, microbiologists, watershed groups — work on different parts of the carbamate problem. The strongest response stacks them.
    - generic [ref=e544]:
      - article [ref=e546]:
        - paragraph [ref=e547]: EPA · EU Commission
        - heading "Regulatory restriction" [level=3] [ref=e548]
        - paragraph [ref=e549]: Carbofuran granular use was cancelled in the U.S. in 2009; aldicarb registrations have been repeatedly tightened. EU has banned several N-methyl carbamates outright, citing groundwater contamination and pollinator risk.
      - article [ref=e551]:
        - paragraph [ref=e552]: FAO · land-grant extensions
        - heading "Integrated Pest Management" [level=3] [ref=e553]
        - paragraph [ref=e554]: Threshold-based scouting, beneficial-insect releases, and crop rotation reduce reliance on broad-spectrum carbamates. Adoption is slow on commodity crops because chemical inputs remain cheaper per acre.
      - article [ref=e556]:
        - paragraph [ref=e557]: Academic researchers
        - heading "Bioremediation" [level=3] [ref=e558]
        - paragraph [ref=e559]: Soil bacteria of the Pseudomonas and Bacillus genera express carbaryl hydrolase enzymes that cleave the carbamate linkage. Field trials show measurable cleanup of contaminated soils.
      - article [ref=e561]:
        - paragraph [ref=e562]: NRCS · watershed groups
        - heading "Buffer strips & runoff controls" [level=3] [ref=e563]
        - paragraph [ref=e564]: Vegetated buffers, cover crops, and conservation tillage cut sediment-bound carbamate loads to surface waters by 60–90% in modelled and field studies.
    - generic [ref=e566]:
      - generic [ref=e567]: RECOMMENDED
      - paragraph [ref=e568]: Best practice
      - heading "Best practice — IPM with regulatory backstop" [level=3] [ref=e569]:
        - generic [ref=e570]: Best
        - generic [ref=e571]: practice
        - generic [ref=e572]: —
        - generic [ref=e573]: IPM
        - generic [ref=e574]: with
        - generic [ref=e575]: regulatory
        - generic [ref=e576]: backstop
      - paragraph [ref=e577]: No single control eliminates carbamate harm. The most defensible approach pairs Integrated Pest Management at the farm scale with hard regulatory limits at the registration scale. IPM cuts unnecessary applications; regulation removes the most dangerous compounds (aldicarb, carbofuran) outright. Bioremediation and buffer strips treat the residue that still escapes.
    - generic [ref=e578]:
      - paragraph [ref=e580]: Limits & shortcomings
      - heading "What this approach does not solve." [level=3] [ref=e581]:
